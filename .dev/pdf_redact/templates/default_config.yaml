version: "1.0"

# Text redaction patterns
text_redaction:
  pii:
    redact_emails: false
    redact_phone_numbers: false
    redact_addresses: false
    redact_ssn: false
    custom_names: []
    custom_textbox_matches: []
    custom_patterns: []
  patterns: []

# Logo/image redaction
logo_redaction:
  templates: []
  # Example:
  # - name: "company_logo"
  #   image_path: "/absolute/path/to/2. logos/logo.png"
  #   confidence_threshold: 0.65
  #   scale_range:
  #     min: 0.5
  #     max: 3.0
  #     step: 0.1

# Processing settings
processing:
  render_dpi: 300
  max_workers: 4
  redaction_color: [255, 255, 255]  # White
  output:
    preserve_metadata: false
    compress: true
    linearize: true

# Reporting settings
reporting:
  generate_report: true
  report_format: "json"
  include_coordinates: true
